# Contributor License Agreement check for pull requests (CLA.md).
# Runs on pull_request_target so it can comment and set a status on PRs from
# forks; it never checks out or runs code from the pull request.
# Signatures are committed to the `cla-signatures` branch of this repository,
# which must exist and must not be protected.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the Audivane CLA and I hereby sign it'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: Triet1402,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Audivane CLA and I hereby sign it
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before it can be merged, please read the
            [Audivane Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by commenting below with the sentence shown. You only need to do this once per repository.
          custom-allsigned-prcomment: All contributors have signed the Audivane CLA. Thank you!
          signed-commit-message: "CLA: $contributorName signed in #$pullRequestNo"
          create-file-commit-message: "CLA: create the signature file"
