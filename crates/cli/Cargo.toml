[package]
name = "audivane-dsp-cli"
description = "avdsp: offline processing, tests and daemon control for Audivane DSP"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
audivane-dsp-core.workspace = true
audivane-protocol.workspace = true
anyhow.workspace = true
clap.workspace = true
hound.workspace = true
serde_json.workspace = true
# SHA-256 of downloaded release packages (`avdsp upgrade`); already in the
# lockfile through Tauri.
sha2 = "0.10"

[[bin]]
name = "avdsp"
path = "src/main.rs"
